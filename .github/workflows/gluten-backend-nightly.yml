name: Gluten Bolt Backend Nightly

on:
  schedule:
    # 02:00 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gluten-backend-nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gluten-backend-nightly:
    name: Test Gluten Bolt backend
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name != 'schedule' || github.repository == 'bytedance/bolt') }}
    uses: ./.github/workflows/bolt_backend_x86.yml
    with:
      mode: full
      bolt_repository: ${{ github.repository }}
      bolt_sha: ${{ github.sha }}
      gluten_repository: apache/gluten
      # Pin Apache source after the required native/test changes land on its main branch.
      gluten_sha: APACHE_GLUTEN_COMMIT_REQUIRED
      helper_repository: ${{ github.repository }}
      helper_sha: ${{ github.sha }}
      driver_repository: bytedance/bolt
      driver_sha: 72f74589df524b2f4a7695b4f10c5b13a95812e8
