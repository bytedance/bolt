name: Gluten Bolt Backend (x86)

on:
  workflow_call:
    inputs:
      mode:
        description: compile for libraries, native for libraries and native UT, full for all tests
        required: true
        type: string
      bolt_repository:
        description: Repository containing the Bolt engine candidate
        required: true
        type: string
      bolt_sha:
        description: Exact Bolt engine commit
        required: true
        type: string
      gluten_repository:
        description: Repository containing the Gluten source candidate
        required: true
        type: string
      gluten_sha:
        description: Gluten source ref, resolved once to an exact commit
        required: true
        type: string
      helper_repository:
        description: Repository containing the trusted Gluten CI helpers
        required: true
        type: string
      helper_sha:
        description: Exact Bolt workflow/helper commit
        required: true
        type: string
      driver_repository:
        description: Repository containing the trusted Bolt Spark test driver
        required: false
        type: string
        default: 'bytedance/bolt'
      driver_sha:
        description: Exact trusted Bolt Spark test driver commit
        required: false
        type: string
        default: '72f74589df524b2f4a7695b4f10c5b13a95812e8'
      runner_labels:
        description: JSON array of Bolt self-hosted runner labels
        required: false
        type: string
        default: '["self-hosted","Linux","X64","medium"]'
      runner_image:
        description: Bolt x86 CI worker image
        required: false
        type: string
        default: 'bolt-registry:5000/bolt-ci:20260921'
  workflow_dispatch:
    inputs:
      mode:
        description: compile for libraries, native for libraries and native UT, full for all tests
        required: true
        type: choice
        options: [compile, native, full]
      bolt_repository:
        description: Repository containing the Bolt engine candidate
        required: true
        type: string
      bolt_sha:
        description: Exact Bolt engine commit
        required: true
        type: string
      gluten_repository:
        description: Repository containing the Gluten source candidate
        required: true
        type: string
      gluten_sha:
        description: Gluten source ref, resolved once to an exact commit
        required: true
        type: string
      helper_repository:
        description: Repository containing the trusted Gluten CI helpers
        required: true
        type: string
      helper_sha:
        description: Exact Bolt workflow/helper commit
        required: true
        type: string
      driver_repository:
        description: Repository containing the trusted Bolt Spark test driver
        required: false
        type: string
        default: 'bytedance/bolt'
      driver_sha:
        description: Exact trusted Bolt Spark test driver commit
        required: false
        type: string
        default: '72f74589df524b2f4a7695b4f10c5b13a95812e8'
      runner_labels:
        description: JSON array of Bolt self-hosted runner labels
        required: false
        type: string
        default: '["self-hosted","Linux","X64","medium"]'
      runner_image:
        description: Bolt x86 CI worker image
        required: false
        type: string
        default: 'bolt-registry:5000/bolt-ci:20260921'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI_MODE: ${{ inputs.mode }}
  CI_RUNNER_LABELS: ${{ inputs.runner_labels }}
  CI_RUNNER_IMAGE: ${{ inputs.runner_image }}
  BOLT_REPOSITORY: ${{ inputs.bolt_repository }}
  BOLT_SHA: ${{ inputs.bolt_sha }}
  GLUTEN_REPOSITORY: ${{ inputs.gluten_repository }}
  GLUTEN_SHA: ${{ inputs.gluten_sha }}
  HELPER_REPOSITORY: ${{ inputs.helper_repository }}
  HELPER_SHA: ${{ inputs.helper_sha }}
  DRIVER_REPOSITORY: ${{ inputs.driver_repository }}
  DRIVER_SHA: ${{ inputs.driver_sha }}

jobs:
  prepare:
    name: Resolve Gluten CI matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gluten_sha: ${{ steps.matrix.outputs.gluten_sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      native_jdk: ${{ steps.matrix.outputs.native_jdk }}
      runner_labels: ${{ steps.matrix.outputs.runner_labels }}
      config_sha256: ${{ steps.matrix.outputs.config_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.helper_repository }}
          ref: ${{ inputs.helper_sha }}
          path: bolt-ci-helpers
          persist-credentials: false
      - id: gluten-source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gluten_repository }}
          ref: ${{ inputs.gluten_sha }}
          path: gluten-source
          persist-credentials: false
      - id: matrix
        run: |
          test "$(git -C bolt-ci-helpers rev-parse HEAD)" = "$HELPER_SHA"
          GLUTEN_SHA="$(git -C gluten-source rev-parse HEAD)"
          export GLUTEN_SHA
          echo "gluten_sha=$GLUTEN_SHA" >> "$GITHUB_OUTPUT"
          python3 bolt-ci-helpers/scripts/gluten-ci/actions.py prepare

  native:
    name: Gluten Bolt native (${{ inputs.mode }})
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels) }}
    timeout-minutes: 360
    container:
      image: ${{ inputs.runner_image }}
      options: --user root --init
      volumes:
        - /data/ccache-data:/data/ccache-data:ro
        - /opt/bolt-arrow-sources:/opt/bolt-arrow-sources:ro
        - /opt/bolt-arrow-cache.py:/opt/bolt-arrow-cache.py:ro
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        volumes:
          # Conan reads create adjacent revision lock files; HTTP access remains read-only.
          - /data/conan-server-data:/var/conan/data:rw
    outputs:
      native_artifact: ${{ steps.task.outputs.native_artifact }}
    env:
      GLUTEN_SHA: ${{ needs.prepare.outputs.gluten_sha }}
      GLUTEN_CI_CONFIG_SHA256: ${{ needs.prepare.outputs.config_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.helper_repository }}
          ref: ${{ inputs.helper_sha }}
          path: bolt-ci-helpers
          persist-credentials: false
      - name: Verify the trusted helper checkout
        run: test "$(git -C bolt-ci-helpers rev-parse HEAD)" = "$HELPER_SHA"
      - id: task
        uses: ./bolt-ci-helpers/.github/actions/bolt-ci-task
        with:
          task: native
          jdk: ${{ needs.prepare.outputs.native_jdk }}

  downstream:
    name: Gluten Bolt ${{ matrix.task }}
    needs: [prepare, native]
    if: inputs.mode == 'full'
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels) }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ${{ inputs.runner_image }}
      options: --user root --init
    env:
      GLUTEN_SHA: ${{ needs.prepare.outputs.gluten_sha }}
      GLUTEN_CI_CONFIG_SHA256: ${{ needs.prepare.outputs.config_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.helper_repository }}
          ref: ${{ inputs.helper_sha }}
          path: bolt-ci-helpers
          persist-credentials: false
      - name: Verify the trusted helper checkout
        run: test "$(git -C bolt-ci-helpers rev-parse HEAD)" = "$HELPER_SHA"
      - uses: ./bolt-ci-helpers/.github/actions/bolt-ci-task
        with:
          task: ${{ matrix.task }}
          jdk: ${{ matrix.jdk }}
          native_artifact: ${{ needs.native.outputs.native_artifact }}
