name: Conan CI Dependency Upload

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Dependency build type to prewarm
        required: true
        type: choice
        options: [All, Release, Debug]
        default: Release

env:
  CCACHE_DIR: /data/ccache-data
  CCACHE_MAX_SIZE: '100G'
  CI_NUM_THREADS: "16"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    name: upload (${{ matrix.runner_host }}, ${{ inputs.build_type }})
    strategy:
      fail-fast: false
      matrix:
        runner_host:
          - bolt-ci-amd64
          - bolt-ci-amd64-2
          - bolt-ci-amd64-3
    runs-on: [ self-hosted, medium, "${{ matrix.runner_host }}" ]
    timeout-minutes: 720
    container:
      image: bolt-registry:5000/bolt-ci:20260114
      options: --user root --init
      volumes:
        - /data/ccache-data:/data/ccache-data
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        env:
          CONAN_ADMIN_USER: ${{ secrets.CONAN_ADMIN_USERNAME }}
          CONAN_ADMIN_PASSWORD: ${{ secrets.CONAN_ADMIN_PASSWORD }}
        volumes:
          - /data/conan-server-data:/var/conan/data
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: env-setup
        uses: ./.github/actions/bolt-build-base

      - name: Install Release dependency graph
        if: ${{ inputs.build_type == 'All' || inputs.build_type == 'Release' }}
        shell: bash
        run: |
          conan install . \
            -s "llvm-core/*:build_type=Release" \
            -s "build_type=Release" \
            -c "bolt/*:tools.build:skip_test=False" \
            -o "bolt/*:spark_compatible=True" \
            -o "bolt/*:enable_s3=True" \
            -o "bolt/*:enable_gcs=True" \
            -o "bolt/*:enable_testutil=True" \
            -o "bolt/*:enable_perf=True" \
            --build=missing

      - name: Install Debug dependency graph
        if: ${{ !cancelled() && steps.env-setup.outcome == 'success' && (inputs.build_type == 'All' || inputs.build_type == 'Debug') }}
        shell: bash
        run: |
          conan install . \
            -s "llvm-core/*:build_type=Release" \
            -s "build_type=Debug" \
            -c "bolt/*:tools.build:skip_test=False" \
            -o "bolt/*:spark_compatible=True" \
            -o "bolt/*:enable_s3=True" \
            -o "bolt/*:enable_gcs=True" \
            -o "bolt/*:enable_testutil=True" \
            -o "bolt/*:enable_perf=True" \
            --build=missing

      - name: Upload packages to conan remote
        if: ${{ always() && steps.env-setup.outcome == 'success' }}
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_ADMIN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_ADMIN_PASSWORD }}
        run: |
          conan remote auth ci
          conan upload -r ci --confirm --check "*"
