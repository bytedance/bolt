# Run the full Gluten UT matrix against the Bolt backend via
# scripts/gluten_ut/run.sh (parallel dispatcher with bwrap per-suite isolation,
# slow-suites priority dispatch, case-level blacklist).

name: Bolt Gluten UT

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      gluten_repo:
        description: 'Gluten repo to check out; leave blank to use the hardcoded default below.'
        required: false
        default: ''
      gluten_ref:
        description: 'Gluten branch/tag/sha to check out; leave blank to use the hardcoded default below.'
        required: false
        default: ''

env:
  GLUTEN_REPO: ${{ inputs.gluten_repo || 'zhangxffff/gluten' }}
  GLUTEN_REF: ${{ inputs.gluten_ref || 'chore/run_gluten_ut' }}
  # Matches build-test.yml — ccache + conan cache live under /data on the host.
  CCACHE_DIR: /data/ccache-data
  CCACHE_MAX_SIZE: '100G'
  CI_NUM_THREADS: "16"
  IN_CI: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark-ut:
    runs-on: [ self-hosted, medium ]
    container:
      image: bolt-registry:5000/bolt-ci:20260114
      # --privileged: bwrap (run.sh per-suite isolation) needs SYS_ADMIN.
      options: --user root --init --privileged
      volumes:
        - /data/ccache-data:/data/ccache-data
        - /data/bolt-gluten-ut-arrow:/root/.m2/repository/org/apache/arrow
        - /data/bolt-gluten-ut-spark:/data/bolt-gluten-ut-spark
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        volumes:
          - /data/conan-server-data:/var/conan/data
    timeout-minutes: 240
    steps:
      - name: Checkout bolt (this repo)
        uses: actions/checkout@v6

      - name: Checkout gluten at ${{ env.GLUTEN_REF }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GLUTEN_REPO }}
          ref: ${{ env.GLUTEN_REF }}
          path: gluten

      - name: Install JDK 17 + build bubblewrap >=0.10 from source
        # Full JDK (not -headless) is required: arrow's cmake JNI detection
        # needs AWT, which is only present in the full openjdk-17-jdk package.
        # bubblewrap: Debian 12 ships 0.8.0 which lacks --overlay-src /
        # --tmp-overlay (added in 0.10.0). run.sh uses those flags for
        # per-suite test-classes isolation, so we build a newer release.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            openjdk-17-jdk meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bwrap
          meson setup /tmp/bwrap/build /tmp/bwrap --buildtype=release -Dman=disabled
          meson compile -C /tmp/bwrap/build
          install -m 0755 /tmp/bwrap/build/bwrap /usr/local/bin/bwrap
          rm -rf /tmp/bwrap
          bwrap --version
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Set up bolt build environment (conan)
        uses: ./.github/actions/bolt-build-base

      - name: Align conan default profile with bolt.profile
        # bolt's Makefile installs with `-pr default -pr scripts/conan/bolt.profile`,
        # but gluten's Makefile only uses `-pr default`. The bolt profile injects a
        # `[tool_requires] cmake/3.31.10`, which Conan 2 folds into bolt's
        # package_id. Without merging, gluten resolves a different package_id for
        # bolt than `make release_spark` exported, triggering a `--build=missing`
        # rebuild from `source()` (which clones github main, NOT the local PR
        # bolt). Append the bolt-profile fragment to default so both invocations
        # agree on bolt's package_id and the cached binary is reused.
        run: cat scripts/conan/bolt.profile >> ~/.conan2/profiles/default

      - name: Build local bolt (make release_spark)
        run: make release_spark && make export_release

      - name: Build gluten native libs (make release)
        working-directory: ${{ github.workspace }}/gluten
        run: make release

      - name: Build gluten-arrow if jars missing or patches changed
        # arrow jars live on the /data/bolt-gluten-ut-arrow host volume
        # (mounted at /root/.m2/repository/org/apache/arrow). A stamp file
        # records the hash of the arrow patches + build script so we
        # rebuild only when those actually change
        working-directory: ${{ github.workspace }}/gluten
        run: |
          STAMP=/root/.m2/repository/org/apache/arrow/.gluten-15.0.0.stamp
          KEY=$(sha256sum ep/build-velox/src/modify_arrow*.patch \
                          ep/build-velox/src/cmake-compatibility.patch \
                          dev/build_arrow.sh 2>/dev/null \
                | sha256sum | cut -d' ' -f1)
          if [[ -f $STAMP && "$(cat $STAMP)" == "$KEY" ]] \
             && ls /root/.m2/repository/org/apache/arrow/arrow-dataset/15.0.0-gluten/*.jar > /dev/null 2>&1; then
            echo "arrow jars match stamp $KEY — skip rebuild"
          else
            bash dev/build_arrow.sh
            echo "$KEY" > "$STAMP"
          fi

      - name: Populate Spark binary + source SQL test resources on /data
        # Layout under /data/bolt-gluten-ut-spark/:
        #   spark_home/                              — Spark 3.5.5 binary dist.
        #                                              SPARK_HOME points here.
        #   sql/                                     — sql/ subtree from the
        #                                              source tarball only.
        #   spark_home/sql → ../sql                  — grafts source sql/ onto
        #                                              the binary tree (gluten
        #                                              tests read this).
        #   spark_home/launcher/target/scala-2.12/   — empty dir, satisfies
        #                                              Spark's
        #                                              AbstractCommandBuilder.
        #                                              getScalaVersion() in
        #                                              test mode. Without it,
        #                                              local-cluster Worker
        #                                              forks throw "Cannot
        #                                              find any build
        #                                              directories" and
        #                                              GlutenSortShuffleSuite
        #                                              / GlutenBroadcastJoin*
        #                                              cascade-fail before any
        #                                              Executor launches.
        run: |
          set -e
          BASE=/data/bolt-gluten-ut-spark
          HOME_DIR=$BASE/spark_home
          SQL_DIR=$BASE/sql
          if [[ -d "$HOME_DIR/jars" && -d "$SQL_DIR/core" \
                && -L "$HOME_DIR/sql" \
                && -d "$HOME_DIR/launcher/target/scala-2.12" ]]; then
            exit 0
          fi
          mkdir -p "$BASE"
          (
            flock -x 200
            URL=https://archive.apache.org/dist/spark/spark-3.5.5
            if [[ ! -d "$HOME_DIR/jars" ]]; then
              rm -rf "${HOME_DIR}.tmp"
              mkdir -p "${HOME_DIR}.tmp"
              wget -qO- "$URL/spark-3.5.5-bin-hadoop3.tgz" \
                | tar -xz --strip-components=1 -C "${HOME_DIR}.tmp"
              mv "${HOME_DIR}.tmp" "$HOME_DIR"
            fi
            if [[ ! -d "$SQL_DIR/core" ]]; then
              rm -rf "${SQL_DIR}.tmp"
              mkdir -p "${SQL_DIR}.tmp"
              wget -qO- "$URL/spark-3.5.5.tgz" \
                | tar -xz --strip-components=2 -C "${SQL_DIR}.tmp" spark-3.5.5/sql
              mv "${SQL_DIR}.tmp" "$SQL_DIR"
            fi
            ln -sfn ../sql "$HOME_DIR/sql"
            mkdir -p "$HOME_DIR/launcher/target/scala-2.12"
          ) 200> "$BASE/.lock"

      - name: Run Gluten UT (parallel, blacklist-aware)
        env:
          GLUTEN_HOME: ${{ github.workspace }}/gluten
          SPARK_HOME: /data/bolt-gluten-ut-spark/spark_home/
          JOBS: '8'
        run: bash scripts/gluten_ut/run.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-gluten-ut-reports
          path: |
            scripts/gluten_ut/logs/*.log
            scripts/gluten_ut/logs/*.tsv
            scripts/gluten_ut/logs/reports/**/TEST-*.xml
          if-no-files-found: warn
