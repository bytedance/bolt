# Run the full Gluten UT matrix against the Bolt backend via
# scripts/gluten_ut/run.sh (parallel dispatcher with bwrap per-suite isolation,
# slow-suites priority dispatch, case-level blacklist).

name: Bolt Gluten UT

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      gluten_repo:
        description: 'Gluten repo (override BOLT_RUNNER_GLUTEN_REPO); leave blank to use the variable default.'
        required: false
        default: ''
      gluten_ref:
        description: 'Gluten branch/tag/sha (override BOLT_RUNNER_GLUTEN_REF); leave blank to use the variable default.'
        required: false
        default: ''

env:
  # Manual-dispatch inputs override the repo variables; on pull_request `inputs.*`
  # is empty so the `||` falls back to vars.*.
  GLUTEN_REPO: ${{ inputs.gluten_repo || vars.BOLT_RUNNER_GLUTEN_REPO }}
  GLUTEN_REF: ${{ inputs.gluten_ref || vars.BOLT_RUNNER_GLUTEN_REF }}
  # Matches build-test.yml — ccache + conan cache live under /data on the host.
  CCACHE_DIR: /data/ccache-data
  CCACHE_MAX_SIZE: '100G'
  CI_NUM_THREADS: "16"
  IN_CI: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark-ut:
    runs-on: [ self-hosted, medium ]
    container:
      image: bolt-registry:5000/bolt-ci:20260114
      # --privileged: bwrap (run.sh per-suite isolation) needs SYS_ADMIN.
      options: --user root --init --privileged
      volumes:
        - /data/ccache-data:/data/ccache-data
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        volumes:
          - /data/conan-server-data:/var/conan/data
    timeout-minutes: 240
    steps:
      - name: Probe vars + verify required env
        # Prints what the workflow sees for the BOLT_RUNNER_* repo variables,
        # then hard-fails if either GLUTEN_REPO or GLUTEN_REF resolved to empty
        # — actions/checkout silently falls back to the current repo on empty
        # `repository:`, which masks the problem until much later steps fail
        # with "No such file or directory".
        run: |
          echo "::group::vars probe"
          echo "vars.BOLT_RUNNER_GLUTEN_REPO=[${{ vars.BOLT_RUNNER_GLUTEN_REPO }}]"
          echo "vars.BOLT_RUNNER_GLUTEN_REF=[${{ vars.BOLT_RUNNER_GLUTEN_REF }}]"
          echo "vars.BOLT_RUNNER_CONAN_HOME=[${{ vars.BOLT_RUNNER_CONAN_HOME }}]"
          echo "inputs.gluten_repo=[${{ inputs.gluten_repo }}]"
          echo "inputs.gluten_ref=[${{ inputs.gluten_ref }}]"
          echo "env.GLUTEN_REPO=[$GLUTEN_REPO]"
          echo "env.GLUTEN_REF=[$GLUTEN_REF]"
          echo "::endgroup::"
          [[ -n "$GLUTEN_REPO" && -n "$GLUTEN_REF" ]] || {
            echo "::error::GLUTEN_REPO / GLUTEN_REF empty. Set vars.BOLT_RUNNER_GLUTEN_REPO and vars.BOLT_RUNNER_GLUTEN_REF in bytedance/bolt repository variables, or pass inputs via workflow_dispatch."
            exit 1
          }

      - name: Checkout bolt (this repo)
        uses: actions/checkout@v6

      - name: Checkout gluten at ${{ env.GLUTEN_REF }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GLUTEN_REPO }}
          ref: ${{ env.GLUTEN_REF }}
          path: gluten

      - name: Install JDK 17 + build bubblewrap >=0.10 from source
        # Full JDK (not -headless) is required: arrow's cmake JNI detection
        # needs AWT, which is only present in the full openjdk-17-jdk package.
        # bubblewrap: Debian 12 ships 0.8.0 which lacks --overlay-src /
        # --tmp-overlay (added in 0.10.0). run.sh uses those flags for
        # per-suite test-classes isolation, so we build a newer release.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            openjdk-17-jdk meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bwrap
          meson setup /tmp/bwrap/build /tmp/bwrap --buildtype=release -Dman=disabled
          meson compile -C /tmp/bwrap/build
          install -m 0755 /tmp/bwrap/build/bwrap /usr/local/bin/bwrap
          rm -rf /tmp/bwrap
          bwrap --version
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Set up bolt build environment (conan)
        uses: ./.github/actions/bolt-build-base

      - name: Align conan default profile with bolt.profile
        # bolt's Makefile installs with `-pr default -pr scripts/conan/bolt.profile`,
        # but gluten's Makefile only uses `-pr default`. The bolt profile injects a
        # `[tool_requires] cmake/3.31.10`, which Conan 2 folds into bolt's
        # package_id. Without merging, gluten resolves a different package_id for
        # bolt than `make release_spark` exported, triggering a `--build=missing`
        # rebuild from `source()` (which clones github main, NOT the local PR
        # bolt). Append the bolt-profile fragment to default so both invocations
        # agree on bolt's package_id and the cached binary is reused.
        run: cat scripts/conan/bolt.profile >> ~/.conan2/profiles/default

      - name: Build local bolt (make release_spark)
        run: make release_spark && make export_release

      - name: Build gluten native libs (make release)
        working-directory: ${{ github.workspace }}/gluten
        run: make release

      - name: Restore gluten-arrow:15.0.0-gluten jars
        id: arrow-cache
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository/org/apache/arrow
          # Cache invalidates when arrow patches or the build script change.
          key: arrow-15.0.0-gluten-${{ hashFiles('gluten/ep/build-velox/src/modify_arrow*.patch', 'gluten/ep/build-velox/src/cmake-compatibility.patch', 'gluten/dev/build_arrow.sh') }}

      - name: Build gluten-arrow (first run only; ~25 min)
        if: steps.arrow-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/gluten
        run: bash dev/build_arrow.sh

      - name: Restore Spark 3.5.5 source resources
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gluten/shims/spark35/spark_home
          key: spark-3.5.5-src-resources-v1

      - name: Install Spark 3.5.5 source resources
        if: steps.spark-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/gluten
        # Source tarball only (~30 MB). Gluten tests resolve Spark's runtime
        # jars from Maven Central via pom; SPARK_HOME only feeds
        # spark.test.home (sql/core/src/test/resources/). Suites that need
        # bin/spark-submit + jars/ for local-cluster sub-JVMs are blacklisted.
        run: |
          set -e
          BASE=https://archive.apache.org/dist/spark/spark-3.5.5
          DEST=shims/spark35/spark_home
          mkdir -p "$DEST"
          wget -qO- "$BASE/spark-3.5.5.tgz" | tar -xz --strip-components=1 -C "$DEST"

      - name: Run Gluten UT (parallel, blacklist-aware)
        env:
          GLUTEN_HOME: ${{ github.workspace }}/gluten
          SPARK_HOME: ${{ github.workspace }}/gluten/shims/spark35/spark_home/
          JOBS: '8'
        run: bash scripts/gluten_ut/run.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-gluten-ut-reports
          path: |
            scripts/gluten_ut/logs/_install.log
            scripts/gluten_ut/logs/_dispatch.log
            scripts/gluten_ut/logs/_suites.tsv
            scripts/gluten_ut/logs/_suites_dispatch_order.tsv
            scripts/gluten_ut/logs/reports/**/TEST-*.xml
            scripts/gluten_ut/logs/*.log
          if-no-files-found: warn
          retention-days: 14
