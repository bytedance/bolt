# Run the full gluten Spark UT matrix against the Bolt backend via
# scripts/gluten_ut/run.sh (parallel dispatcher with bwrap per-suite isolation,
# slow-suites priority dispatch, case-level blacklist).
#
# Runtime: ~25 min on a warm runner; the first run on a fresh runner takes
# ~1.5h because of three one-time builds:
#   * gluten-arrow:15.0.0-gluten Java jars (~25 min via dev/build_arrow.sh)
#   * Spark 3.5.5 tarballs (~1 min once cached)
#   * Gluten cpp natives, including libglutenlibloader.so and libbolt_backend.so
#     (~30-60 min clean; ccache + conan cache drop subsequent runs to ~5-10 min)
# All three are cached across runs via actions/cache or persistent volumes.

name: Bolt Spark UT

on:
  pull_request:
    paths:
      - '.github/workflows/bolt_spark_ut.yml'
      - 'scripts/gluten_ut/**'

env:
  GLUTEN_REPO: zhangxffff/gluten
  GLUTEN_REF: chore/run_gluten_ut
  # Matches build-test.yml — ccache + conan cache live under /data on the host.
  CCACHE_DIR: /data/ccache-data
  CCACHE_MAX_SIZE: '100G'
  CI_NUM_THREADS: "16"
  IN_CI: '1'

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  spark-ut:
    runs-on: [ self-hosted, medium ]
    container:
      image: bolt-registry:5000/bolt-ci:20260114
      # --privileged: bwrap (run.sh per-suite isolation) needs SYS_ADMIN.
      options: --user root --init --privileged
      volumes:
        - /data/ccache-data:/data/ccache-data
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        volumes:
          - /data/conan-server-data:/var/conan/data
    timeout-minutes: 240
    steps:
      - name: Checkout bolt (this repo)
        uses: actions/checkout@v6

      - name: Checkout gluten at ${{ env.GLUTEN_REF }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GLUTEN_REPO }}
          ref: ${{ env.GLUTEN_REF }}
          path: gluten

      - name: Install JDK 17 + build bubblewrap >=0.10 from source
        # Full JDK (not -headless) is required: arrow's cmake JNI detection
        # needs AWT, which is only present in the full openjdk-17-jdk package.
        # bubblewrap: Debian 12 ships 0.8.0 which lacks --overlay-src /
        # --tmp-overlay (added in 0.10.0). run.sh uses those flags for
        # per-suite test-classes isolation, so we build a newer release.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            openjdk-17-jdk meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bwrap
          meson setup /tmp/bwrap/build /tmp/bwrap --buildtype=release -Dman=disabled
          meson compile -C /tmp/bwrap/build
          install -m 0755 /tmp/bwrap/build/bwrap /usr/local/bin/bwrap
          rm -rf /tmp/bwrap
          bwrap --version
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Set up bolt build environment (conan)
        uses: ./.github/actions/bolt-build-base

      - name: Export local bolt as a conan recipe
        # gluten's `make bolt-recipe` clones bolt from github.com/bytedance/bolt
        # at the BOLT_BUILD_VERSION tag — that bypasses any PR changes. Stand in
        # for it by exporting the LOCAL bolt checkout (which has this PR's diff)
        # into the conan cache under the same `bolt/main` reference.
        run: conan export ./conanfile.py --name=bolt --version=main

      - name: Build gluten native libs (make release)
        working-directory: ${{ github.workspace }}/gluten
        # Produces cpp/build/releases/libglutenlibloader.so and
        # libbolt_backend.so. backends-bolt/pom.xml's <resource> declaration
        # copies them into target/scala-2.12/classes/linux/amd64/ at
        # mvn-install time, where the JNI loader on the test classpath
        # finds them.
        run: make release BOLT_BUILD_VERSION=main

      - name: Restore gluten-arrow:15.0.0-gluten jars
        id: arrow-cache
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository/org/apache/arrow
          # Cache invalidates when arrow patches or the build script change.
          key: arrow-15.0.0-gluten-${{ hashFiles('gluten/ep/build-velox/src/modify_arrow*.patch', 'gluten/ep/build-velox/src/cmake-compatibility.patch', 'gluten/dev/build_arrow.sh') }}

      - name: Build gluten-arrow (first run only; ~25 min)
        if: steps.arrow-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/gluten
        # dev/build_arrow.sh: downloads apache/arrow 15.0.0, applies gluten
        # patches, builds C++ + Java, installs *:15.0.0-gluten jars to
        # /root/.m2. Heavy on the first run; cached afterwards.
        run: bash dev/build_arrow.sh

      - name: Restore Spark 3.5.5 binary + test resources
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gluten/shims/spark35/spark_home
          key: spark-3.5.5-bin-hadoop3-resources-v1

      - name: Install Spark 3.5.5 binary + test resources
        if: steps.spark-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/gluten
        # Pipe wget directly into tar so nothing hits disk twice.
        # Binary distribution lays jars/bin/python under SPARK_HOME — Spark's
        # launcher falls back to $SPARK_HOME/jars when assembly/target is
        # absent, so no source-build layout shim is needed.
        # Source tarball: extract only the SQL test resources that some
        # Gluten suites read at runtime.
        # Mirror choice: dlcdn.apache.org only serves the *latest* 3.5.x (now
        # 3.5.8) and archive.apache.org is unreachably slow from this runner
        # (saw a 2h47m hang). huaweicloud mirrors retired versions and is
        # responsive from CN networks.
        run: |
          set -e
          BASE=https://mirrors.huaweicloud.com/apache/spark/spark-3.5.5
          DEST=shims/spark35/spark_home
          mkdir -p "$DEST"
          wget -qO- "$BASE/spark-3.5.5-bin-hadoop3.tgz" | tar -xz --strip-components=1 -C "$DEST"
          wget -qO- "$BASE/spark-3.5.5.tgz" | tar -xz --strip-components=1 -C "$DEST" spark-3.5.5/sql/core/src/test/resources/

      - name: Run gluten Spark UT (parallel, blacklist-aware)
        env:
          GLUTEN_HOME: ${{ github.workspace }}/gluten
          SPARK_HOME: ${{ github.workspace }}/gluten/shims/spark35/spark_home/
        run: bash scripts/gluten_ut/run.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-spark-ut-reports
          path: |
            scripts/gluten_ut/logs/_install.log
            scripts/gluten_ut/logs/_dispatch.log
            scripts/gluten_ut/logs/_suites.tsv
            scripts/gluten_ut/logs/_suites_dispatch_order.tsv
            scripts/gluten_ut/logs/reports/**/TEST-*.xml
            scripts/gluten_ut/logs/*.log
          if-no-files-found: warn
          retention-days: 14
