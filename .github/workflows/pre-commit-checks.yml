name: pre-commit checks

on:
  pull_request:
    branches: [ main ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_COMMIT_HOME: /data/pre-commit-cache
  CCACHE_DIR: /data/ccache-data
  CCACHE_MAX_SIZE: '100G'
  CI_NUM_THREADS: "16"
  IN_CI: '1'
  GOMAXPROCS: 8
  GOMODCACHE: /data/pre-commit-cache/gomodcache
  GOCACHE: /data/pre-commit-cache/gocache

jobs:
  lint:
    runs-on: ['self-hosted', 'medium']
    container:
      image: bolt-registry:5000/bolt-ci:20260114
      options: --user root --init
      volumes:
        - pre-commit-cache:/data/pre-commit-cache
        - /data/ccache-data:/data/ccache-data
    services:
      conanserver:
        image: bolt-registry:5000/conan-server:latest
        volumes:
          - /data/conan-server-data:/var/conan/data
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: env-setup
        uses: ./.github/actions/bolt-build-base
      - name: Install pre-commit
        run: |
          pip install -r requirements.txt
      - name: Generate Compile Database
        run: |
          make compile_db_all
      - name: Ensure generated headers exist
        run: |
          # _compile_db (invoked by compile_db_all) is supposed to build these,
          # but make it explicit so clang-tidy in the next step never races
          # against a missing dwrf_schema.pb.h / parquet thrift header. If the
          # underlying chain already produced them, this is a no-op rebuild.
          cmake --build --preset conan-release \
            --target generate_parquet_thrift \
            --target bolt_dwio_dwrf_proto
          test -f _build/Release/bolt/dwio/dwrf/proto/dwrf_schema.pb.h \
            || { echo "::error::dwrf_schema.pb.h missing after proto build" >&2; \
                 ls -la _build/Release/bolt/dwio/dwrf/proto/ || true; exit 1; }
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
