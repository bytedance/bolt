# Runner's native tool-cache mount carries this read-only subtree into job containers.
x-local-sources: &local-sources
  environment:
    RUNNER_TOOL_CACHE: /opt/bolt-runner-tools
  volumes:
    - type: bind
      source: ${HOST_DATA_DIR:?HOST_DATA_DIR is required}/conan-source-cache/archives
      target: /opt/bolt-runner-tools/bolt-source-cache
      read_only: true
      bind:
        create_host_path: false

services:
  runner-medium:
    <<: *local-sources
  runner-small:
    <<: *local-sources
