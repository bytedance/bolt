worker_processes 1;
user www-data;
pid /tmp/conan-source-nginx.pid;
error_log /dev/stderr crit;
events {}
http {
  access_log off;
  server_tokens off;
  sendfile on;
  server {
    listen 9301;
    disable_symlinks on;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /s/ { return 200; }
    # Conan requires metadata after fetching a blob. Do not expose server URLs.
    location ~ "^/s/[0-9a-f]{64}\.json$" {
      default_type application/json;
      return 200 '{"references": {}}';
    }
    location ~ "^/s/[0-9a-f]{64}$" {
      root /var/conan/data/source-backup;
    }
    location / { return 404; }
  }
}
