[build-system]
requires = ["scikit-build-core>=1.0", "conan==2.32.0"]
build-backend = "bolt_build_backend"
backend-path = ["packaging"]

[project]
name = "bolt-engine"
version = "0.0.1"
description = "BoltML data processing with the native Bolt execution engine"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
dependencies = [
    "cloudpickle>=3.1.2",
    "numpy>=1.26.0",
    "pillow>=12.0.0",
    "pyarrow>=16.0.0",
    # BoltML uses the scanner and configuration APIs from Paimon 1.3.
    "pypaimon>=1.3.2,<1.4",
    "ray>=2.10",
    # 0.30+ removes protobuf fields used by Bolt's current Substrait plans.
    "substrait>=0.27.0,<0.30.0",
    "thrift>=0.22.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/bytedance/bolt"
Repository = "https://github.com/bytedance/bolt"

[dependency-groups]
test = ["ray[default]==2.59.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "../.."
cmake.version = ">=3.25"
build.targets = ["pybolt"]
build-dir = "build/{wheel_tag}"
install.components = ["bolt_python_wheel"]
wheel.packages = ["pybolt", "boltml"]
# CMake installs the repository and HMS notices into dist-info/licenses.
wheel.license-files = []
wheel.exclude = [
    "**/*.cpp", "**/*.h", "**/CMakeLists.txt", "**/__pycache__/**", "**/*.pyc",
    "pybolt/test/**", "boltml/test/**",
]
sdist.exclude = [
    "**/_generated/**",
    "**/build/**", "**/_build/**", "**/dist/**", "**/.venv/**",
    "**/*.so", "**/*.dylib", "**/*.o", "**/*.a", "**/*.pyc",
    "**/__pycache__/**",
]

# The checkout's C++ sources live above this Python project. Vendor the build
# inputs into the source distribution so it can be built without the checkout.
[tool.scikit-build.sdist.force-include]
"../../CMakeLists.txt" = "native/CMakeLists.txt"
"../../conanfile.py" = "native/conanfile.py"
"../../Makefile" = "native/Makefile"
"../../bolt" = "native/bolt"
"../../scripts" = "native/scripts"
"../../requirements.txt" = "native/requirements.txt"
"../../README.md" = "native/README.md"
"../../CONTRIBUTING.md" = "native/CONTRIBUTING.md"
"../../LICENSE" = "LICENSE"
"../../NOTICE.txt" = "NOTICE.txt"

[[tool.scikit-build.overrides]]
if.from-sdist = true
cmake.source-dir = "native"
sdist.force-include = {}
