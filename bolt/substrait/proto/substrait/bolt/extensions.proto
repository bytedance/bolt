syntax = "proto3";

package substrait.bolt;

import "bolt/substrait/proto/substrait/algebra.proto";
import "google/protobuf/any.proto";

message FileFormat {
  oneof file_format {
    ReadRel.LocalFiles.FileOrFiles.ParquetReadOptions parquet = 1;
    ReadRel.LocalFiles.FileOrFiles.ArrowReadOptions arrow = 2;
    ReadRel.LocalFiles.FileOrFiles.OrcReadOptions orc = 3;
    ReadRel.LocalFiles.FileOrFiles.DwrfReadOptions dwrf = 4;
    ReadRel.LocalFiles.FileOrFiles.DelimiterSeparatedTextReadOptions text = 5;
    // If none of the Substrait file formats can be used.
    google.protobuf.Any extension = 6;
  }
}

// -------------------------
// Tpch Extensions
// -------------------------

// Implementation to handle TPC-H generator cases.
//
// Wire-compat note: field 3 ``scale_factor_deprecated`` used to be a
// ``uint64`` (varint wire type) before the floating-point requirement
// was uncovered. Reusing the same field number with a wider type
// would have been silently lossy — uint64 (varint) and double
// (fixed64) are different wire types, so old serialisers can't be
// read with new readers and vice versa. Instead the field is kept
// at its original number as ``scale_factor_deprecated``, and the
// floating-point value lives at field 6 ``scale_factor_double``.
// Readers prefer the double when set and fall back to the
// deprecated uint64 cast to double. Writers populate BOTH so old
// readers continue to see the integer cast (works for whole-number
// scales) and new readers see the precise double. Once every
// deployment has been upgraded the deprecated field can be removed.
message TpchExtensionTable {
  string table_name = 1;
  repeated string column_names = 2;
  uint64 scale_factor_deprecated = 3 [deprecated = true];
  uint64 num_splits = 4;
  string connector_id = 5;
  optional double scale_factor_double = 6;
}

// -------------------------
// Paimon Extensions
// -------------------------

// Implementation to handle Paimon tables in Substrait `ReadRel`.
message PaimonExtensionTable {
  // Arbitrary parameters to pass to Paimon (e.g., "merge-engine" configuration).
  optional Expression.Literal.Map parameters = 1;
  FileFormat file_format = 2;
  repeated PaimonSplit splits = 3;

  message PaimonSplit {
    repeated string file_uris = 1;
  }
}

// -------------------------
// Hive Extensions
// -------------------------

// Additional attributes for advanced extensions of write relations.
message HiveExtension {
  FileFormat file_format = 1;
  uint64 bucket_count = 2;
  repeated string bucket_keys = 3;
  repeated string partition_keys = 4;
}

// -------------------------
// Shuffle Extensions
// -------------------------
// Details for Substrait `ExtensionSingleRel` used in local shuffle plan nodes.
message LocalShuffleExtension {
  int64 seed = 1;
}
